<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1220 640" width="1220" height="640" font-family="Arial, Helvetica, sans-serif">
  <rect x="-40" y="0" width="1220" height="640" fill="#ffffff"/>

  <!-- ============ CONNECTING LINES (drawn first) ============ -->
  <g stroke="#222" stroke-width="2" fill="none">
    <!-- STAFF -> ASSIGNED -->
    <line x1="510" y1="90" x2="250" y2="215"/>
    <!-- ASSIGNED -> RIDER / TRIP -->
    <line x1="155" y1="260" x2="100" y2="380"/>
    <line x1="250" y1="305" x2="330" y2="380"/>
    <!-- STAFF -> APPROVED AND ASSIGNED -->
    <line x1="590" y1="90" x2="850" y2="205"/>
    <!-- APPROVED AND ASSIGNED -> DELIVERY / COURIER REQUEST -->
    <line x1="730" y1="260" x2="710" y2="390"/>
    <line x1="970" y1="260" x2="1015" y2="390"/>
  </g>

  <!-- attribute lines -->
  <g stroke="#555" stroke-width="1.3">
    <line x1="475" y1="65" x2="395" y2="50"/>
    <line x1="625" y1="65" x2="705" y2="50"/>
    <line x1="75" y1="430" x2="40" y2="472"/>
    <line x1="125" y1="430" x2="160" y2="472"/>
    <line x1="305" y1="430" x2="270" y2="472"/>
    <line x1="355" y1="430" x2="390" y2="472"/>
    <line x1="330" y1="430" x2="330" y2="522"/>
    <line x1="685" y1="440" x2="650" y2="472"/>
    <line x1="735" y1="440" x2="770" y2="472"/>
    <line x1="985" y1="440" x2="960" y2="472"/>
    <line x1="1045" y1="440" x2="1070" y2="472"/>
    <line x1="1015" y1="440" x2="1015" y2="522"/>
  </g>

  <!-- ============ ENTITIES ============ -->
  <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5">
    <rect x="475" y="40"  width="150" height="50" rx="2"/>   <!-- STAFF -->
    <rect x="30"  y="380" width="140" height="50" rx="2"/>   <!-- RIDER -->
    <rect x="260" y="380" width="140" height="50" rx="2"/>   <!-- TRIP -->
    <rect x="640" y="390" width="140" height="50" rx="2"/>   <!-- DELIVERY -->
    <rect x="930" y="390" width="170" height="50" rx="2"/>   <!-- COURIER REQUEST -->
  </g>
  <g font-size="17" font-weight="bold" fill="#0c4a6e" text-anchor="middle">
    <text x="550"  y="71">STAFF</text>
    <text x="100"  y="411">RIDER</text>
    <text x="330"  y="411">TRIP</text>
    <text x="710"  y="421">DELIVERY</text>
    <text x="1015" y="421">COURIER REQUEST</text>
  </g>

  <!-- ============ RELATIONSHIPS (diamonds) ============ -->
  <g fill="#fef3c7" stroke="#b45309" stroke-width="2.5">
    <polygon points="250,215 345,260 250,305 155,260"/>
    <polygon points="850,205 970,260 850,315 730,260"/>
  </g>
  <g font-weight="bold" fill="#78350f" text-anchor="middle">
    <text x="250" y="266" font-size="16">ASSIGNED</text>
    <text x="850" y="255" font-size="14">APPROVED</text>
    <text x="850" y="274" font-size="14">AND ASSIGNED</text>
  </g>

  <!-- ============ CARDINALITIES ============ -->
  <g font-size="17" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="480" y="122">M</text>    <!-- Staff - ASSIGNED -->
    <text x="124" y="352">N</text>    <!-- Rider -->
    <text x="322" y="360">1</text>    <!-- Trip -->
    <text x="620" y="122">M</text>    <!-- Staff - APPROVED -->
    <text x="708" y="360">1</text>    <!-- Delivery -->
    <text x="1008" y="356">N</text>   <!-- Courier Request -->
  </g>

  <!-- ============ ATTRIBUTES ============ -->
  <g fill="#f0fdf4" stroke="#15803d" stroke-width="1.5">
    <ellipse cx="340" cy="50"  rx="55" ry="20"/>   <!-- staff_id -->
    <ellipse cx="760" cy="50"  rx="60" ry="20"/>   <!-- staff_name -->
    <ellipse cx="40"  cy="490" rx="50" ry="18"/>   <!-- rider_nic -->
    <ellipse cx="160" cy="490" rx="55" ry="18"/>   <!-- rider_name -->
    <ellipse cx="270" cy="490" rx="45" ry="18"/>   <!-- trip_id -->
    <ellipse cx="390" cy="490" rx="50" ry="18"/>   <!-- trip_date -->
    <ellipse cx="330" cy="540" rx="55" ry="18"/>   <!-- trip_status -->
    <ellipse cx="650" cy="490" rx="45" ry="18"/>   <!-- del_id -->
    <ellipse cx="775" cy="490" rx="62" ry="18"/>   <!-- delivery_status -->
    <ellipse cx="960" cy="490" rx="48" ry="18"/>   <!-- book_id -->
    <ellipse cx="1075" cy="490" rx="42" ry="18"/>  <!-- status -->
    <ellipse cx="1015" cy="540" rx="62" ry="18"/>  <!-- courier_date -->
  </g>
  <g font-size="12" fill="#14532d" text-anchor="middle">
    <text x="340"  y="54" text-decoration="underline">staff_id</text>
    <text x="760"  y="54">staff_name</text>
    <text x="40"   y="494" text-decoration="underline">rider_nic</text>
    <text x="160"  y="494">rider_name</text>
    <text x="270"  y="494" text-decoration="underline">trip_id</text>
    <text x="390"  y="494">trip_date</text>
    <text x="330"  y="544">trip_status</text>
    <text x="650"  y="494" text-decoration="underline">del_id</text>
    <text x="775"  y="494">delivery_status</text>
    <text x="960"  y="494" text-decoration="underline">book_id</text>
    <text x="1075" y="494">status</text>
    <text x="1015" y="544">courier_date</text>
  </g>

  <!-- ============ TITLE / NOTES ============ -->
  <text x="570" y="600" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">ER Diagram - Staff Approval and Rider Assignment (SC Courier)</text>
  <text x="570" y="622" font-size="12" fill="#555" text-anchor="middle">Underlined = primary key.  Ternary relationships: ASSIGNED (Staff, Rider, Trip) and APPROVED AND ASSIGNED (Staff, Courier Request, Delivery).</text>
</svg>

